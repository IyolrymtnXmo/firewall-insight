    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;

    .frame { max-width: 1400px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;

    h1 {

      font-size: clamp(1.8rem, 2.5vw + 1rem, 2.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 2rem;
    }
    svg { width: 100%; min-width: 1100px; display: block; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4)); }
    @keyframes flow {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    .flow-path {
      stroke-dasharray: 6 6;
      animation: flow 1s linear infinite;
    }
  </style>
</head>
